[project]
name = "click2key"
version = "0.1.5"
description = "Turn Zwift Click V2 button presses into keyboard shortcuts"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
    "customtkinter>=5.2",
    "cryptography>=42",
    "pynput>=1.7",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyinstaller>=6.10"]

[project.scripts]
click2key = "click2key.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["click2key*"]
