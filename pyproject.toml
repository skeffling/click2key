[project]
name = "clickwhoosh"
version = "0.1.0"
description = "Bridge a Zwift Click V2 controller to MyWhoosh via the Link protocol"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
    "customtkinter>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
clickwhoosh = "clickwhoosh.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clickwhoosh*"]
